<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="title desc"><title id="title">Generalization evaluation design</title><desc id="desc">Hold out scene, object, task and embodiment shifts; evaluate predictions, decisions, execution and resources.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f3f6fb"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient><linearGradient id="flow"><stop stop-color="#738fae"/><stop offset=".55" stop-color="#3d6699"/><stop offset="1" stop-color="#887294"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#7890af" stroke-width="1.2"/></marker></defs><rect width="560" height="820" fill="url(#wash)"/><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="40" font-size="17" fill="#5d7696" text-anchor="start" font-weight="400">GENERALIZATION: A STUDY DESIGN</text><text x="25" y="84" font-size="27" fill="#263b56" text-anchor="start" font-weight="400">Hold out separately</text><rect x="20" y="110" width="520" height="60" rx="8" fill="#f9faf9" stroke="#ccd7e4"/><text x="38" y="148" font-size="24" fill="#263b56" text-anchor="start" font-weight="400">Scene</text><text x="247" y="148" font-size="21" fill="#6c7f98" text-anchor="start" font-weight="400">layout / illumination</text><rect x="20" y="184" width="520" height="60" rx="8" fill="#f9faf9" stroke="#ccd7e4"/><text x="38" y="222" font-size="24" fill="#263b56" text-anchor="start" font-weight="400">Object</text><text x="247" y="222" font-size="21" fill="#6c7f98" text-anchor="start" font-weight="400">shape / material</text><rect x="20" y="258" width="520" height="60" rx="8" fill="#f9faf9" stroke="#ccd7e4"/><text x="38" y="296" font-size="24" fill="#263b56" text-anchor="start" font-weight="400">Task</text><text x="247" y="296" font-size="21" fill="#6c7f98" text-anchor="start" font-weight="400">new composition</text><rect x="20" y="332" width="520" height="60" rx="8" fill="#f9faf9" stroke="#ccd7e4"/><text x="38" y="370" font-size="24" fill="#263b56" text-anchor="start" font-weight="400">Embodiment</text><text x="247" y="370" font-size="21" fill="#6c7f98" text-anchor="start" font-weight="400">body / control rate</text><text x="25" y="455" font-size="27" fill="#263b56" text-anchor="start" font-weight="400">Then measure</text><circle cx="42.00" cy="501.00" r="6" fill="#6583a8" opacity="1"/><text x="63" y="498" font-size="23" fill="#263b56" text-anchor="start" font-weight="400">Prediction</text><text x="63" y="523" font-size="19" fill="#6c7f98" text-anchor="start" font-weight="400">state / action consistency</text><circle cx="42.00" cy="567.00" r="6" fill="#6583a8" opacity="1"/><text x="63" y="564" font-size="23" fill="#263b56" text-anchor="start" font-weight="400">Decision</text><text x="63" y="589" font-size="19" fill="#6c7f98" text-anchor="start" font-weight="400">candidate ranking</text><circle cx="42.00" cy="633.00" r="6" fill="#6583a8" opacity="1"/><text x="63" y="630" font-size="23" fill="#263b56" text-anchor="start" font-weight="400">Execution</text><text x="63" y="655" font-size="19" fill="#6c7f98" text-anchor="start" font-weight="400">success / recovery</text><circle cx="42.00" cy="699.00" r="6" fill="#6583a8" opacity="1"/><text x="63" y="696" font-size="23" fill="#263b56" text-anchor="start" font-weight="400">Resources</text><text x="63" y="721" font-size="19" fill="#6c7f98" text-anchor="start" font-weight="400">latency / data budget</text><text x="25" y="788" font-size="18" fill="#6c7f98" text-anchor="start" font-weight="400">Study design only; no benchmark results shown.</text></g></svg>