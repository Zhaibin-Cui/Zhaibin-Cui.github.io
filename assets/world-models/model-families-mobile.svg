<svg xmlns="http://www.w3.org/2000/svg" width="560" height="730" viewBox="0 0 560 730" role="img" aria-labelledby="title desc"><title id="title">Four modeling roles</title><desc id="desc">Portrait comparison of video generation, world modeling, VLA policies and world action models.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f3f6fb"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient><linearGradient id="flow"><stop stop-color="#738fae"/><stop offset=".55" stop-color="#3d6699"/><stop offset="1" stop-color="#887294"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#7890af" stroke-width="1.2"/></marker></defs><rect width="560" height="730" fill="url(#wash)"/><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="40" font-size="17" fill="#5d7696" text-anchor="start" font-weight="400">FOUR MODELING ROLES</text><rect x="20" y="65" width="520" height="132" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="41" y="100" font-size="27" fill="#7e8cae" text-anchor="start" font-weight="400">Video generator</text><text x="41" y="133" font-size="20" fill="#64748a" text-anchor="start" font-weight="400">Plausible visual continuation</text><path d="M43 165 L102 165" fill="none" stroke="#7e8cae" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><text x="122" y="172" font-size="22" fill="#7e8cae" text-anchor="start" font-weight="400">images / video</text><rect x="20" y="216" width="520" height="132" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="41" y="251" font-size="27" fill="#3d6b9f" text-anchor="start" font-weight="400">World model</text><text x="41" y="284" font-size="20" fill="#64748a" text-anchor="start" font-weight="400">Consequences of an action</text><path d="M43 316 L102 316" fill="none" stroke="#3d6b9f" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><text x="122" y="323" font-size="22" fill="#3d6b9f" text-anchor="start" font-weight="400">future state</text><rect x="20" y="367" width="520" height="132" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="41" y="402" font-size="27" fill="#857197" text-anchor="start" font-weight="400">VLA policy</text><text x="41" y="435" font-size="20" fill="#64748a" text-anchor="start" font-weight="400">Action from observation + goal</text><path d="M43 467 L102 467" fill="none" stroke="#857197" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><text x="122" y="474" font-size="22" fill="#857197" text-anchor="start" font-weight="400">action sequence</text><rect x="20" y="518" width="520" height="132" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="41" y="553" font-size="27" fill="#617c82" text-anchor="start" font-weight="400">World action model</text><text x="41" y="586" font-size="20" fill="#64748a" text-anchor="start" font-weight="400">Future and action modeled jointly</text><path d="M43 618 L102 618" fill="none" stroke="#617c82" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><text x="122" y="625" font-size="22" fill="#617c82" text-anchor="start" font-weight="400">future + action</text><text x="26" y="699" font-size="19" fill="#64748a" text-anchor="start" font-weight="400">Architectures can combine these roles.</text></g></svg>