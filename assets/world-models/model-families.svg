<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">World models, video generation, policies and world action models</title><desc id="desc">Four modeling roles separated by their questions and outputs. Architectures may combine roles.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f3f6fb"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient><linearGradient id="flow"><stop stop-color="#738fae"/><stop offset=".55" stop-color="#3d6699"/><stop offset="1" stop-color="#887294"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#7890af" stroke-width="1.2"/></marker></defs><rect width="1120" height="620" fill="url(#wash)"/><g font-family="Arial,Helvetica,sans-serif"><text x="52" y="52" font-size="16" fill="#5d7696" text-anchor="start" font-weight="400">FOUR QUESTIONS, DIFFERENT OBJECTIVES</text><rect x="38" y="83" width="1044" height="98" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="62" y="115" font-size="23" fill="#7e8cae" text-anchor="start" font-weight="500">Video generator</text><text x="62" y="148" font-size="17" fill="#64748a" text-anchor="start" font-weight="400">What might a future scene look like?</text><path d="M520 133 L617 133" fill="none" stroke="#7e8cae" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><circle cx="650.00" cy="133.00" r="5" fill="#7e8cae" opacity="0.5"/><circle cx="676.00" cy="148.87" r="5" fill="#7e8cae" opacity="0.6"/><path d="M650 133.0 L676 148.8666369672395" fill="none" stroke="#7e8cae" stroke-width="1.7" opacity="0.7"/><circle cx="702.00" cy="128.91" r="5" fill="#7e8cae" opacity="0.7"/><path d="M676 148.8666369672395 L702 128.9113423675707" fill="none" stroke="#7e8cae" stroke-width="1.7" opacity="0.7"/><circle cx="728.00" cy="118.19" r="5" fill="#7e8cae" opacity="0.8"/><path d="M702 128.9113423675707 L728 118.18696