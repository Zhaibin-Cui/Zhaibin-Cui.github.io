400">Which action should the robot take?</text><path d="M520 367 L617 367" fill="none" stroke="#857197" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><circle cx="650.00" cy="359.00" r="5" fill="#857197" opacity="0.5"/><circle cx="676.00" cy="375.00" r="5" fill="#857197" opacity="0.6"/><path d="M650 359 L676 375" fill="none" stroke="#857197" stroke-width="1.7" opacity="0.7"/><circle cx="702.00" cy="359.00" r="5" fill="#857197" opacity="0.7"/><path d="M676 375 L702 359" fill="none" stroke="#857197" stroke-width="1.7" opacity="0.7"/><circle cx="728.00" cy="375.00" r="5" fill="#857197" opacity="0.8"/><path d="M702 359 L728 375" fill="none" stroke="#857197" stroke-width="1.7" opacity="0.7"/><circle cx="754.00" cy="359.00" r="5" fill="#857197" opacity="0.9"/><path d="M728 375 L754 359" fill="none" stroke="#857197" stroke-width="1.7" opacity="0.7"/><text x="795" y="373" font-size="21" fill="#857197" text-anchor="start" font-weight="400">action sequence</text><rect x="38" y="434" width="1044" height="98" rx="10" fill="#fcfcfa" stroke="#dce2ea"/><text x="62" y="466" font-size="23" fill="#617c82" text-anchor="start" font-weight="500">World action model</text><text x="62" y="499" font-size="17" fill="#64748a" text-anchor="start" font-weight="400">Which future and action fit together?</text><path d="M520 484 L617 484" fill="none" stroke="#617c82" stroke-width="2" opacity="1" marker-end="url(#arrow)"/><circle cx="650.00" cy="484.00" r="5" fill="#617c82" opacity="0.5"/><circle cx="676.00" cy="499.87" r="5" fill="#617c82" opacity="0.6"/><path d="M650 484.0 L676 499.8666369672395" fill="none" stroke="#617c82" stroke-width="1.7" opacity="0.7"/><circle cx="702.00" cy="479.91" r="5" fill="#617c82" opacity="0.7"/><path d="M676 499.8666369672395 L702 479.9113423675707" fill="none" stroke="#617c82" stroke-width="1.7" opacity="0.7"/><circle cx="728.00" cy="469.19" r="5" fill="#617c82" opacity="0.8"/><path d="M702 479.9113423675707 L728 469.1869650827563" fill="none" stroke="#617c82" stroke-width="1.7" opacity="0.7"/><circle cx="754.00" cy="491.91" r="5" fill="#617c82" opacity="0.9"/><path d="M728 469.1869650827563 L754 491.90581361821773" fill="none" stroke="#617c82" stroke-width="1.7" opacity="0.7"/><text x="795" y="490" font-size="21" fill="#617c82" text-anchor="start" font-weight="400">joint future + action</text><text x="56" y="588" font-size="19" fill="#64748a" text-anchor="start" font-weight="400">These roles can share a backbone; the training target and control interface still matter.</text></g></svg>