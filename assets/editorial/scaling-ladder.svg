<title id="title">Scaling ladder from small to medium to large models</title><desc id="desc">A conceptual three-tier ladder: small-scale controlled experiments, medium-scale trend and extrapolation estimates, and large-scale held-out validation. No internal model sizes, measured performance, or configuration details are shown.</desc>
