<text x="696" y="375" font-size="28" font-weight="600">Distributed</text>
<text x="696" y="412" font-size="28" font-weight="600">pretraining</text>
<text x="696" y="480" font-size="18" fill="#626872">Multi-GPU execution</text>
<text x="696" y="513" font-size="18" fill="#626872">Consistent run metadata</text>
